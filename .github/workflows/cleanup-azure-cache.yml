name: Cleanup Azure Cache

on:
  workflow_dispatch:
    inputs:
      current_version:
        description: "Version directory to keep (will not be deleted). The previous semver-sorted version will also be retained. Leave blank when using target_version."
        required: false
        type: string
        default: ""
      target_version:
        description: "Optional. When set, delete ONLY this version directory and skip keep-current/keep-previous logic. Must match a versioned directory present on the share. Refuses to delete current_version if both are set."
        required: false
        type: string
        default: ""
      storage_account:
        description: "Azure storage account name. Defaults to repo variable AZURE_CACHE_STORAGE_ACCOUNT."
        required: false
        type: string
        default: ""
      cache_share:
        description: "Azure Files share name. Defaults to repo variable AZURE_CACHE_FILE_SHARE."
        required: false
        type: string
        default: ""
      dry_run:
        description: "List what would be deleted (azcopy --dry-run) without deleting anything. Combine with target_version to test one directory."
        required: false
        type: boolean
        default: false
  schedule:
    # Weekly safety net in case dispatched cleanups are skipped or fail.
    - cron: "37 4 * * 1"

permissions:
  id-token: write
  contents: read

concurrency:
  # Allow at most one cleanup run at a time, but never cancel an in-progress one.
  group: cleanup-azure-cache
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: azure-production
    # The first run after this change may clear a large backlog of old
    # versions; later runs normally delete one or two directories.
    timeout-minutes: 120
    steps:
      - name: Resolve cleanup variables
        id: vars
        shell: bash
        env:
          # Use github.event.inputs.* (with fallback) instead of inputs.*
          # so the schedule trigger does not error on context evaluation;
          # inputs.* is only populated for workflow_dispatch / workflow_call.
          INPUT_CURRENT_VERSION: ${{ github.event.inputs.current_version || '' }}
          INPUT_TARGET_VERSION: ${{ github.event.inputs.target_version || '' }}
          INPUT_STORAGE_ACCOUNT: ${{ github.event.inputs.storage_account || '' }}
          INPUT_CACHE_SHARE: ${{ github.event.inputs.cache_share || '' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          REPO_STORAGE_ACCOUNT: ${{ vars.AZURE_CACHE_STORAGE_ACCOUNT }}
          REPO_CACHE_SHARE: ${{ vars.AZURE_CACHE_FILE_SHARE }}
        run: |
          set -euo pipefail

          current_version="${INPUT_CURRENT_VERSION:-}"
          target_version="${INPUT_TARGET_VERSION:-}"
          storage_account="${INPUT_STORAGE_ACCOUNT:-${REPO_STORAGE_ACCOUNT:-}}"
          cache_share="${INPUT_CACHE_SHARE:-${REPO_CACHE_SHARE:-}}"

          if [[ -z "$storage_account" ]]; then
            storage_account="simpledynamsoftmcpsa"
          fi
          if [[ -z "$cache_share" ]]; then
            cache_share="mcp-cache"
          fi

          version_regex='^[0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z]+)*$'

          if [[ -n "$target_version" ]]; then
            if [[ ! "$target_version" =~ $version_regex ]]; then
              echo "::error::target_version '$target_version' does not match version pattern; refusing to proceed."
              exit 1
            fi
            if [[ -n "$current_version" && "$target_version" == "$current_version" ]]; then
              echo "::error::target_version '$target_version' equals current_version; refusing to delete the version that should be kept."
              exit 1
            fi
          fi

          # current_version may be empty when triggered by schedule or when
          # target_version mode is in use. The cleanup step branches on this.
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"
          echo "target_version=$target_version" >> "$GITHUB_OUTPUT"
          echo "storage_account=$storage_account" >> "$GITHUB_OUTPUT"
          echo "cache_share=$cache_share" >> "$GITHUB_OUTPUT"
          echo "dry_run=${INPUT_DRY_RUN:-false}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Clean up old cache versions in Azure Files
        shell: bash
        run: |
          set -euo pipefail

          account="${{ steps.vars.outputs.storage_account }}"
          share="${{ steps.vars.outputs.cache_share }}"
          current_version="${{ steps.vars.outputs.current_version }}"
          target_version="${{ steps.vars.outputs.target_version }}"

          if ! key="$(timeout -k 30s 180s az storage account keys list \
            --account-name "$account" \
            --query "[0].value" \
            --only-show-errors \
            -o tsv)" || [[ -z "$key" ]]; then
            echo "::error::Storage account key lookup failed for ${account}; cache cleanup did not run."
            exit 1
          fi
          echo "::add-mask::$key"

          if ! dirs_output="$(timeout -k 30s 180s az storage file list \
            --account-name "$account" \
            --account-key "$key" \
            --share-name "$share" \
            --num-results "*" \
            --query "[?properties.contentLength == null].name" \
            --only-show-errors \
            -o tsv)"; then
            echo "::error::Listing directories in share ${share} failed; cache cleanup did not run."
            exit 1
          fi

          if [[ -n "$dirs_output" ]]; then
            mapfile -t dirs <<< "$dirs_output"
          else
            dirs=()
          fi

          version_regex='^[0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z]+)*$'
          versioned_dirs=()
          for dir in "${dirs[@]}"; do
            if [[ -n "$dir" && "$dir" =~ $version_regex ]]; then
              versioned_dirs+=("$dir")
            fi
          done

          if (( ${#versioned_dirs[@]} == 0 )); then
            echo "No versioned cache directories found; skipping cleanup"
            exit 0
          fi

          mapfile -t sorted_versions < <(printf '%s\n' "${versioned_dirs[@]}" | sort -V)

          keep_versions=()
          delete_versions=()
          if [[ -n "$target_version" ]]; then
            # Targeted-deletion mode: delete only target_version and bypass
            # keep-versions selection.
            target_found=0
            for dir in "${sorted_versions[@]}"; do
              if [[ "$dir" == "$target_version" ]]; then
                target_found=1
                break
              fi
            done
            if (( target_found == 0 )); then
              echo "::error::target_version '$target_version' was not found among versioned directories on the share: ${sorted_versions[*]}"
              exit 1
            fi
            delete_versions=("$target_version")
            echo "Targeted deletion mode: will delete only '$target_version'."
          else
            if [[ -n "$current_version" ]]; then
              keep_versions+=("$current_version")
              current_index=-1
              for i in "${!sorted_versions[@]}"; do
                if [[ "${sorted_versions[$i]}" == "$current_version" ]]; then
                  current_index="$i"
                  break
                fi
              done
              if (( current_index > 0 )); then
                keep_versions+=("${sorted_versions[$((current_index - 1))]}")
              fi
            else
              # Schedule path: keep the two newest semver-sorted versions.
              count=${#sorted_versions[@]}
              if (( count >= 1 )); then
                keep_versions+=("${sorted_versions[$((count - 1))]}")
              fi
              if (( count >= 2 )); then
                keep_versions+=("${sorted_versions[$((count - 2))]}")
              fi
            fi

            # Oldest first, so a run cut short by the deadline still removes
            # the stalest data.
            for dir in "${sorted_versions[@]}"; do
              keep=0
              for kept in "${keep_versions[@]}"; do
                if [[ "$dir" == "$kept" ]]; then
                  keep=1
                  break
                fi
              done
              if (( keep == 0 )); then
                delete_versions+=("$dir")
              fi
            done
          fi

          echo "Versioned cache directories on share: ${sorted_versions[*]}"
          echo "Versions to keep: ${keep_versions[*]:-<none>}"
          echo "Versions to delete (${#delete_versions[@]}): ${delete_versions[*]:-<none>}"

          if (( ${#delete_versions[@]} == 0 )); then
            exit 0
          fi

          # Deleting file by file with `az storage file delete` costs one CLI
          # process and REST round trip per file and directory (~1 s each); a
          # single version holds ~9k entries, so cleanup could never keep up.
          # `azcopy remove --recursive` enumerates the directory from the runner
          # and issues many delete requests concurrently in one process, instead
          # of one CLI process per entry. AzCopy is preinstalled on ubuntu-latest.
          sas_expiry="$(date -u -d '+3 hours' '+%Y-%m-%dT%H:%MZ')"
          if ! sas="$(timeout -k 30s 180s az storage share generate-sas \
            --name "$share" \
            --account-name "$account" \
            --account-key "$key" \
            --permissions dlr \
            --expiry "$sas_expiry" \
            --https-only \
            --only-show-errors \
            -o tsv)" || [[ -z "$sas" ]]; then
            echo "::error::Generating a SAS token for share ${share} failed; cache cleanup did not run."
            exit 1
          fi
          echo "::add-mask::$sas"

          export AZCOPY_LOG_LOCATION="$RUNNER_TEMP/azcopy-logs"
          export AZCOPY_JOB_PLAN_LOCATION="$RUNNER_TEMP/azcopy-plans"
          mkdir -p "$AZCOPY_LOG_LOCATION" "$AZCOPY_JOB_PLAN_LOCATION"
          azcopy --version

          directory_exists() {
            local exists
            exists="$(timeout -k 30s 180s az storage directory exists \
              --account-name "$account" \
              --account-key "$key" \
              --share-name "$share" \
              --name "$1" \
              --query exists \
              --only-show-errors \
              -o tsv)" || return 2
            [[ "$exists" == "true" ]]
          }

          dry_run="${{ steps.vars.outputs.dry_run }}"
          deadline_seconds=$((105 * 60))
          started_at="$SECONDS"
          deleted=()
          failed=()
          skipped=()
          previewed=()

          if [[ "$dry_run" == "true" ]]; then
            echo "Dry run: listing what azcopy would delete; nothing is removed."
            for dir in "${delete_versions[@]}"; do
              echo "::group::Dry run for cache directory ${dir}"
              preview_file="$RUNNER_TEMP/dry-run-${dir}.txt"
              if timeout -k 30s 30m azcopy remove \
                "https://${account}.file.core.windows.net/${share}/${dir}?${sas}" \
                --recursive=true \
                --from-to=FileTrash \
                --dry-run \
                --log-level=ERROR > "$preview_file"; then
                entries="$(grep -c "DRYRUN" "$preview_file" || true)"
                head -n 20 "$preview_file"
                previewed+=("${dir} (${entries} entries)")
                echo "Dry run for ${dir}: ${entries} entries would be removed."
              else
                cat "$preview_file"
                failed+=("$dir")
                echo "::error::azcopy dry run failed for ${dir}"
              fi
              echo "::endgroup::"
            done
            {
              echo "## Azure Files cache cleanup (dry run, nothing deleted)"
              echo ""
              echo "- share: \`${share}\`"
              echo "- kept: \`${keep_versions[*]:-<none>}\`"
              echo "- would delete (${#previewed[@]}): ${previewed[*]:-<none>}"
              echo "- failed (${#failed[@]}): \`${failed[*]:-<none>}\`"
              echo "- duration: $((SECONDS - started_at))s"
            } >> "$GITHUB_STEP_SUMMARY"
            if (( ${#failed[@]} > 0 )); then
              exit 1
            fi
            exit 0
          fi

          for dir in "${delete_versions[@]}"; do
            if (( SECONDS - started_at >= deadline_seconds )); then
              skipped+=("$dir")
              continue
            fi

            echo "::group::Deleting cache directory ${dir}"
            dir_started_at="$SECONDS"
            azcopy_ok=1
            if ! timeout -k 30s 30m azcopy remove \
              "https://${account}.file.core.windows.net/${share}/${dir}?${sas}" \
              --recursive=true \
              --from-to=FileTrash \
              --force-if-read-only=true \
              --log-level=ERROR \
              --output-level=essential; then
              azcopy_ok=0
              echo "::warning::azcopy remove reported errors for ${dir}"
            fi

            # AzCopy may leave the (now empty) root directory behind.
            if directory_exists "$dir"; then
              timeout -k 30s 180s az storage directory delete \
                --account-name "$account" \
                --account-key "$key" \
                --share-name "$share" \
                --name "$dir" \
                --only-show-errors \
                -o none || true
            fi

            if directory_exists "$dir"; then
              status="present"
            elif (( $? == 1 )); then
              status="gone"
            else
              status="unknown"
            fi
            echo "::endgroup::"
            case "$status" in
              gone)
                deleted+=("$dir")
                echo "Deleted cache directory ${dir} in $((SECONDS - dir_started_at))s"
                ;;
              present)
                failed+=("$dir")
                echo "::error::Cache directory ${dir} still exists after cleanup (azcopy_ok=${azcopy_ok})."
                ;;
              *)
                failed+=("$dir")
                echo "::error::Could not verify deletion of cache directory ${dir}."
                ;;
            esac
          done

          {
            echo "## Azure Files cache cleanup"
            echo ""
            echo "- share: \`${share}\`"
            echo "- kept: \`${keep_versions[*]:-<none>}\`"
            echo "- deleted (${#deleted[@]}): \`${deleted[*]:-<none>}\`"
            echo "- failed (${#failed[@]}): \`${failed[*]:-<none>}\`"
            echo "- not attempted, deadline reached (${#skipped[@]}): \`${skipped[*]:-<none>}\`"
            echo "- duration: $((SECONDS - started_at))s"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( ${#failed[@]} > 0 || ${#skipped[@]} > 0 )); then
            echo "::error::Cache cleanup incomplete: ${#failed[@]} failed, ${#skipped[@]} not attempted. See the job summary."
            exit 1
          fi

          echo "Cache cleanup complete: deleted ${#deleted[@]} director(ies) in $((SECONDS - started_at))s."
