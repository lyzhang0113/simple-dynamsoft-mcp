name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_lite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Verify data source wiring
        run: npm run data:verify-versions:strict

      - name: Unit tests
        run: npm run test:unit

      - name: Test (lite + package runtime)
        run: npm run test:lite

      - name: Contract tests (URI round-trip + quickstart matrix)
        run: npm run test:contract

      - name: Version drift report
        run: npm run check:version-drift
        continue-on-error: true

  test_lexical_provider:
    runs-on: ubuntu-latest
    env:
      RAG_PROVIDER: lexical
      RAG_FALLBACK: none
      RAG_REBUILD: "false"
      RAG_PREWARM: "false"
      RAG_PREWARM_BLOCK: "false"
      RUN_GEMINI_PROVIDER_TESTS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Test (lexical provider)
        run: npm run test:lexical

      - name: Retrieval quality (golden set, lexical)
        run: npm run test:retrieval

  test_lazy_hydration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (lazy hydration packaged runtime)
        run: npm run test:lazy

  test_lazy_hydration_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (lazy hydration packaged runtime)
        run: npm run test:lazy

  test_package_runtime_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Test (package runtime)
        run: npm run test:package

  test_package_runtime_macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Test (package runtime)
        run: npm run test:package

  # Index builds happen only in the release workflow. This job decides whether
  # a PR changes indexed content: if not, the Gemini job verifies search against
  # the seeded release index (embedding only test queries); if so, Gemini
  # verification is skipped and the index is built at the next release.
  corpus:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes to indexed content
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Paths that change chunk text or which chunks exist. Keep in sync
          # with the indexing code; RAG_MAX_EMBED_CHUNKS below is a backstop.
          pattern='^(data/|src/server/resource-index|src/rag/search-utils\.js|src/rag/config\.js)'
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          if grep -Eq "$pattern" <<< "$changed"; then
            echo "Indexed content changes; Gemini verification skipped (index is built at release)."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  test_gemini_provider:
    needs: corpus
    if: needs.corpus.outputs.changed == 'false'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RAG_PROVIDER: gemini
      RAG_FALLBACK: none
      RAG_REBUILD: "false"
      RAG_PREWARM: "true"
      RAG_PREWARM_BLOCK: "true"
      GEMINI_EMBED_BATCH_SIZE: 16
      RAG_CACHE_DIR: ${{ github.workspace }}/.cache/rag-index-gemini
      RUN_GEMINI_PROVIDER_TESTS: "true"
      # Backstop if the path list above misses something: fail before any
      # embedding call rather than embed more than a handful of chunks.
      RAG_MAX_EMBED_CHUNKS: "50"
      # The index comes only from the seed step; no runtime download in CI.
      RAG_PREBUILT_INDEX_AUTO_DOWNLOAD: "false"
    steps:
      - name: Skip when GEMINI_API_KEY is missing
        if: ${{ env.GEMINI_API_KEY == '' }}
        run: echo "Skipping gemini provider job because GEMINI_API_KEY is not configured."

      - name: Checkout
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node 24
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # No Actions cache: seeding from the latest release gives every run a
      # complete index to reuse, so only chunks changed since that release are
      # embedded, and no ~250 MB cache entry is stored per run.
      - name: Seed RAG cache from the latest release
        if: ${{ env.GEMINI_API_KEY != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/seed-rag-cache.sh "$RAG_CACHE_DIR"
          # The seed script treats a missing asset as non-fatal; here it is
          # fatal, since an unseeded build would re-embed the whole index.
          for header in "$RAG_CACHE_DIR"/rag-gemini-*.json; do
            if [[ -e "$header" && "$header" != *.checkpoint.json && -f "${header%.json}.f32" ]]; then
              echo "Seeded index: $(basename "$header")"
              exit 0
            fi
          done
          echo "::error::No complete release index was seeded into $RAG_CACHE_DIR; refusing to build an index from scratch in CI."
          exit 1

      - name: Install dependencies
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm ci

      - name: Unit tests
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run test:unit

      - name: Bootstrap data
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run data:bootstrap

      - name: Prebuild gemini RAG index (reuses the seeded release index)
        if: ${{ env.GEMINI_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run rag:prebuild 2>&1 | tee "$RUNNER_TEMP/prebuild.log"
          plan="$(grep -ao 'index plan[^"]*' "$RUNNER_TEMP/prebuild.log" | tail -n 1 || true)"
          echo "### Gemini index: ${plan:-no index plan logged (cache hit)}" >> "$GITHUB_STEP_SUMMARY"

      - name: Test (gemini provider)
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run test:gemini
