name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_lite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Verify data source wiring
        run: npm run data:verify-versions:strict

      - name: Test (lite + package runtime)
        run: npm run test:lite

      - name: Contract tests (URI round-trip + quickstart matrix)
        run: npm run test:contract

      - name: Version drift report
        run: npm run check:version-drift
        continue-on-error: true

  test_lexical_provider:
    runs-on: ubuntu-latest
    env:
      RAG_PROVIDER: lexical
      RAG_FALLBACK: none
      RAG_REBUILD: "false"
      RAG_PREWARM: "false"
      RAG_PREWARM_BLOCK: "false"
      RUN_GEMINI_PROVIDER_TESTS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Test (lexical provider)
        run: npm run test:lexical

      - name: Retrieval quality (golden set, lexical)
        run: npm run test:retrieval

  test_lazy_hydration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (lazy hydration packaged runtime)
        run: npm run test:lazy

  test_lazy_hydration_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (lazy hydration packaged runtime)
        run: npm run test:lazy

  test_package_runtime_windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Test (package runtime)
        run: npm run test:package

  test_package_runtime_macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap data
        run: npm run data:bootstrap

      - name: Test (package runtime)
        run: npm run test:package

  # Decides whether the Gemini job (which spends embedding credits) runs: only
  # when retrieval code, index building, docs/data, or the golden set changed.
  # Version-bump-only pushes skip it; the release builds that index anyway.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rag: ${{ steps.diff.outputs.rag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect retrieval-relevant changes
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No usable base commit; running the Gemini job."
            echo "rag=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(src/rag/|src/server/resource-index|src/server/resource-index/|src/data/repo-map\.js|scripts/prebuild-rag-index\.mjs|scripts/seed-rag-cache\.sh|scripts/eval-retrieval\.mjs|scripts/lib/|test/fixtures/retrieval-golden\.json|test/integration/(helpers\.js|stdio\.test\.js|http\.test\.js)|scripts/run-gemini-tests\.mjs|data/|\.github/workflows/ci\.yml)'
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          if grep -Eq "$pattern" <<< "$changed"; then
            echo "rag=true" >> "$GITHUB_OUTPUT"
          else
            echo "No retrieval-relevant changes; skipping the Gemini job."
            echo "rag=false" >> "$GITHUB_OUTPUT"
          fi

  test_gemini_provider:
    needs: changes
    if: needs.changes.outputs.rag == 'true'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RAG_PROVIDER: gemini
      RAG_FALLBACK: none
      RAG_REBUILD: "false"
      RAG_PREWARM: "true"
      RAG_PREWARM_BLOCK: "true"
      GEMINI_EMBED_BATCH_SIZE: 16
      RAG_CACHE_DIR: ${{ github.workspace }}/.cache/rag-index-gemini
      RUN_GEMINI_PROVIDER_TESTS: "true"
    steps:
      - name: Skip when GEMINI_API_KEY is missing
        if: ${{ env.GEMINI_API_KEY == '' }}
        run: echo "Skipping gemini provider job because GEMINI_API_KEY is not configured."

      - name: Checkout
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use Node 24
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Per-commit key: every run saves its (incrementally) updated cache, and
      # the next run restores the newest one through the prefix.
      - name: Restore gemini RAG cache
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/cache@v6
        with:
          path: .cache/rag-index-gemini
          key: rag-gemini-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            rag-gemini-v2-${{ runner.os }}-

      - name: Seed RAG cache from the latest release
        if: ${{ env.GEMINI_API_KEY != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/seed-rag-cache.sh "$RAG_CACHE_DIR"

      - name: Install dependencies
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm ci

      - name: Unit tests
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run test:unit

      - name: Bootstrap data
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run data:bootstrap

      - name: Prebuild gemini RAG index
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run rag:prebuild

      - name: Test (gemini provider)
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: npm run test:gemini
